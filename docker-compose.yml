# Phase 8A-2 - Tile-intel storage tier.
#
# Brings up Postgres 16 + Qdrant 1.11 on non-default loopback ports
# so they never collide with anything else the user has installed.
# These containers back the Python sidecar at `tile-intel-svc/` (lands
# in 8A-3); they are GLOBAL to the host (shared across all ROM-editor
# projects), so the volumes are named for stability across editor
# restarts.
#
# Lifecycle:
#   - `scripts/start.mjs` runs `docker compose up -d` on backend boot
#     when Docker is present; it skips silently with a yellow warning
#     when Docker is missing (tile-intel tools then degrade to
#     `{available:false, reason:'sidecar_offline'}`).
#   - `docker compose down` stops the containers without removing
#     volumes; `docker compose down -v` is the hard-reset path.
#   - The Python sidecar itself does NOT run in Docker - it lives in
#     a uv-managed venv at `tile-intel-svc/.venv/` so the inner dev
#     loop (model swaps, schema iteration) stays fast.
#
# Ports:
#   - 15432: Postgres (default 5432)
#   - 16333: Qdrant REST (default 6333)
#   - 16334: Qdrant gRPC (default 6334)

services:
  tile-intel-pg:
    image: postgres:16-alpine
    container_name: tile-intel-pg
    restart: unless-stopped
    environment:
      # Credentials come from the environment. Copy .env.example to .env
      # and set these before running `docker compose up -d`.
      POSTGRES_DB: ${TILE_INTEL_PG_DATABASE:-tile_intel}
      POSTGRES_USER: ${TILE_INTEL_PG_USER:-tile_intel}
      POSTGRES_PASSWORD: ${TILE_INTEL_PG_PASSWORD:?set TILE_INTEL_PG_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - tile-intel-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TILE_INTEL_PG_USER:-tile_intel} -d ${TILE_INTEL_PG_DATABASE:-tile_intel}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  tile-intel-qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: tile-intel-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - tile-intel-qdrant-data:/qdrant/storage
    # Qdrant's slim image ships only the qdrant binary + bash; no
    # curl, no wget, no ps, no nc. The in-container healthcheck we
    # used to ship here flapped because there's nothing reliable to
    # probe with. Instead, start.mjs runs an external TCP probe on
    # 127.0.0.1:16333 (waitForTcp) as the authoritative readiness
    # check, and Docker's container-level "running" status is enough
    # for compose-up to report success.

volumes:
  tile-intel-pg-data:
    name: tile-intel-pg-data
  tile-intel-qdrant-data:
    name: tile-intel-qdrant-data
