# Phase 8E-3 - Hand-picked community-pack registry.
#
# The sidecar reads this file at startup and surfaces the listed
# packs in the tile-intelligence panel. Users still have to
# download the artifact themselves (we do NOT fetch over the
# network from the sidecar), but the registry tells the editor
# what to expect when the user runs:
#
#   uv run tile-intel ingest-pack <slug> <path-to-archive-or-png>
#
# Format notes:
#   - `slug` is filesystem-safe + becomes the tileset slug prefix.
#   - `cell_size` is the inferred tile dimension; when omitted, the
#     8E-2 grid-inference module runs at ingest time.
#   - `palette_strategy` is `"per-sheet"` (one 16-color quantize
#     per PNG, default), `"per-pack"` (single palette for the whole
#     archive), or `"native-indexed"` (use the PNG's PLTE chunk
#     directly - only valid for indexed-mode PNGs).
#   - `license_spdx` is best-effort. When the source's license is
#     unclear we record `"unknown"` so the library browser shows
#     the right caveat.
#
# This file is hand-edited. The 10 entries below cover the
# canonical "well-known" community packs from major tilesetting
# threads on PokéCommunity / Relic Castle / DeviantArt era.

packs:
  - slug: kyledove-hgss-style
    display_name: "Kyledove - HGSS-Style Outdoor Tiles"
    source_url: "https://www.deviantart.com/kyledove/"
    attribution: "Kyledove (DeviantArt)"
    license_spdx: "unknown"
    cell_size: 16
    padding: 0
    palette_strategy: "per-sheet"
    notes: "Iconic HG/SS-styled outdoor tileset; commonly used in
      ROM hacks that want a Gen-4 visual. Cell size 16 px is the
      RPG-Maker XP standard the artist authored against."

  - slug: pokemonruby-rip-rgss
    display_name: "Pokémon Ruby - Ripped RGSS Tilesets"
    source_url: "https://reliccastle.com/resources/"
    attribution: "Spherical Ice + community rippers"
    license_spdx: "CC-BY-NC"
    cell_size: 16
    padding: 0
    palette_strategy: "native-indexed"
    notes: "Direct RSE-style assets converted from GBA bytes;
      good for projects that want stock RSE look-and-feel."

